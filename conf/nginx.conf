# Nginx Bot Challenge - Configuration Example
#
# This configuration demonstrates how to set up the bot challenge system
# using njs (Nginx JavaScript) module.
#
# Requirements:
# - Nginx compiled with njs module (--with-http_js_module)
# - njs version 0.7.0 or higher recommended
#
# Installation:
#   Ubuntu/Debian: apt-get install nginx-module-njs
#   RHEL/CentOS:   yum install nginx-module-njs
#   Alpine:        apk add nginx-mod-http-js

# Load the njs module
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Enable sendfile for better performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Timeouts
    keepalive_timeout  65;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Buffer sizes.
    # Header buffers must comfortably fit the challenge cookie alongside any
    # other cookies and a long User-Agent, or requests are rejected with 400.
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    client_max_body_size 8m;
    large_client_header_buffers 4 8k;

    # Logging.
    # Do NOT reference $challenge_valid here: it is a js_set variable, so putting
    # it in the default log format forces an HMAC + SHA-256 for every logged
    # request, including static assets and health checks. Use the debug format
    # below only while troubleshooting.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # log_format challenge_debug '$remote_addr [$time_local] "$request" $status '
    #                            'bypass=$bypass_whitelist valid=$challenge_valid '
    #                            'challenged=$need_challenge';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Import njs module
    js_path "/etc/nginx/njs/";
    js_import challenge from challenge.js;

    # Configuration variables for the challenge.
    #
    # IMPORTANT: generate a real secret with `openssl rand -base64 32`.
    # The module refuses to issue or accept challenges when the secret is
    # missing, shorter than 32 characters, or still one of these placeholders.
    js_var $challenge_secret "";
    js_var $challenge_duration "3600";       # Cookie validity in seconds (1 hour)
    js_var $challenge_difficulty "4";        # Proof-of-work difficulty (4 = ~2-5s in a browser)
    js_var $challenge_nonce_ttl "600";       # How long an issued challenge may be redeemed

    # Set validation result using njs function
    js_set $challenge_valid challenge.validateChallenge;

    # --- Whitelisting -------------------------------------------------------
    #
    # Handled natively by geo + map rather than in njs: the geo module uses a
    # radix tree in C, handles IPv4 and IPv6 CIDR correctly, and costs no
    # JavaScript call per request.
    #
    # A User-Agent is attacker-controlled and trivially spoofed
    # (`curl -A UptimeRobot ...`), so it is NEVER sufficient on its own. A
    # bypass requires the request to come from a trusted source address AND
    # carry an expected User-Agent.

    # Source addresses you trust: your own IPs, internal load balancers,
    # and the published ranges of your monitoring providers.
    geo $trusted_source {
        default 0;
        127.0.0.1/32 1;
        ::1/128      1;
        # 10.0.0.0/8     1;   # internal network / k8s probes
        # 192.168.0.0/16 1;
        # 2001:db8::/32  1;
    }

    # User-Agents used by health checks and monitoring services.
    map $http_user_agent $monitor_ua {
        default 0;
        "~*ELB-HealthChecker" 1;
        "~*GoogleHC"          1;
        "~*kube-probe"        1;
        "~*UptimeRobot"       1;
        "~*Pingdom"           1;
        "~*StatusCake"        1;
    }

    # Bypass only when both signals agree.
    map "$trusted_source$monitor_ua" $bypass_whitelist {
        default 0;
        "11"    1;    # trusted source AND expected monitoring User-Agent
        # "10"  1;    # uncomment to let trusted sources bypass unconditionally
    }

    # Single decision variable. Using a map keeps the location blocks free of
    # nested `if`, which nginx does not allow ("if" is not valid inside "if").
    map "$bypass_whitelist$challenge_valid" $need_challenge {
        default 1;    # not whitelisted and no valid cookie -> challenge
        "~^1"   0;    # whitelisted
        "01"    0;    # valid challenge cookie
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=challenge_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # `http2 on;` below requires nginx >= 1.25.1. On older versions use
    # `listen 443 ssl http2;` instead.

    # Example 1: Basic bot protection for a website
    #
    # Serve over HTTPS. The challenge cookie is issued with the Secure
    # attribute on HTTPS requests, and browsers discard Secure cookies sent
    # over plain HTTP, which would leave clients in an endless challenge loop.
    server {
        listen 443 ssl;
        http2 on;
        server_name example.com;

        ssl_certificate     /etc/nginx/ssl/example.com.crt;
        ssl_certificate_key /etc/nginx/ssl/example.com.key;

        root /var/www/html;
        index index.html index.htm;

        # Challenge endpoint for POST requests (solution submission).
        # The small body limit keeps the payload in memory, where
        # r.requestText can read it.
        location = /challenge {
            limit_req zone=challenge_limit burst=5 nodelay;
            client_max_body_size 2k;
            js_content challenge.verifyProofOfWork;
        }

        # Main location with bot challenge
        location / {
            # Vary cache based on challenge cookie for Varnish compatibility
            add_header Vary "Cookie" always;

            if ($need_challenge) {
                js_content challenge.serveChallenge;
            }

            try_files $uri $uri/ =404;
        }

        # Static assets don't need the challenge.
        # Note: a regex location takes precedence over the "/" prefix location,
        # so these are served without a challenge by design.
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Redirect plain HTTP to HTTPS
    server {
        listen 80;
        server_name example.com;
        return 301 https://$host$request_uri;
    }

    # Example 2: Protecting WordPress admin area
    server {
        listen 443 ssl;
        http2 on;
        server_name wordpress.example.com;

        ssl_certificate     /etc/nginx/ssl/wordpress.example.com.crt;
        ssl_certificate_key /etc/nginx/ssl/wordpress.example.com.key;

        root /var/www/wordpress;
        index index.php;

        # Required: the challenge page posts its solution here.
        location = /challenge {
            limit_req zone=challenge_limit burst=5 nodelay;
            client_max_body_size 2k;
            js_content challenge.verifyProofOfWork;
        }

        # Protect wp-admin with challenge
        location /wp-admin/ {
            add_header Vary "Cookie" always;

            if ($need_challenge) {
                js_content challenge.serveChallenge;
            }

            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass unix:/var/run/php/php-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            }
        }

        # Protect wp-login.php
        location = /wp-login.php {
            add_header Vary "Cookie" always;

            if ($need_challenge) {
                js_content challenge.serveChallenge;
            }

            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Normal WordPress rules for other locations
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # Example 3: API endpoint protection with stricter rules
    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.com;

        ssl_certificate     /etc/nginx/ssl/api.example.com.crt;
        ssl_certificate_key /etc/nginx/ssl/api.example.com.key;

        # Challenge endpoint
        location = /challenge {
            limit_req zone=challenge_limit burst=5 nodelay;
            client_max_body_size 2k;
            js_content challenge.verifyProofOfWork;
        }

        # API endpoints with challenge and rate limiting.
        # API clients cannot run JavaScript, so return an error rather than
        # the challenge page; a browser-based client obtains its cookie by
        # visiting a challenged HTML page first.
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            add_header Vary "Cookie" always;

            if ($need_challenge) {
                return 403 '{"error":"Challenge required","message":"Please complete the bot challenge"}';
            }

            proxy_pass http://backend;   # port comes from the upstream block
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public health check endpoint (no challenge).
        # default_type sets the content type; add_header Content-Type would
        # append a duplicate header instead of replacing it.
        location /health {
            default_type text/plain;
            return 200 'OK';
        }
    }

    # Example 4: DDoS mitigation with progressive difficulty
    server {
        listen 443 ssl;
        http2 on;
        server_name protected.example.com;

        ssl_certificate     /etc/nginx/ssl/protected.example.com.crt;
        ssl_certificate_key /etc/nginx/ssl/protected.example.com.key;

        root /var/www/html;

        # Under attack mode: raise the difficulty for this server only.
        # Raising it also invalidates cookies minted at the lower difficulty.
        # Keep it at 5 or below: difficulty 6 costs a browser roughly ten
        # minutes, which locks out legitimate users.
        # js_var $challenge_difficulty "5";

        location = /challenge {
            limit_req zone=challenge_limit burst=5 nodelay;
            client_max_body_size 2k;
            js_content challenge.verifyProofOfWork;
        }

        location / {
            add_header Vary "Cookie" always;

            if ($need_challenge) {
                js_content challenge.serveChallenge;
            }

            try_files $uri $uri/ =404;
        }
    }

    # Upstream backend example
    upstream backend {
        server 127.0.0.1:8080;
        # Add more backend servers as needed
        # server 127.0.0.1:8081;

        keepalive 32;
    }
}
